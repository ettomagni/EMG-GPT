name: inference checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install build ruff cffconvert -c constraints/cpu-tested.txt
      - run: ruff check src scripts tests
      - run: python scripts/check_release.py
      - run: cffconvert --validate
      - name: Build the wheel from the source distribution
        run: |
          python -m build --sdist
          python -m pip wheel --no-deps --wheel-dir dist dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/

  test:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            constraints: cpu-tested
          - python-version: "3.12"
            constraints: cpu-tested
          - python-version: "3.13"
            constraints: cpu-tested
          - python-version: "3.14"
            constraints: cpu-tested
          - python-version: "3.11"
            constraints: minimum
    env:
      OMP_NUM_THREADS: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Install wheel and CPU dependencies
        shell: bash
        run: |
          python -m pip install torch --no-deps -c constraints/${{ matrix.constraints }}.txt --index-url https://download.pytorch.org/whl/cpu
          wheels=(dist/*.whl)
          python -m pip install "${wheels[0]}[dev,data,download]" -c constraints/${{ matrix.constraints }}.txt
          python -m pip check
      - name: Test the installed package outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          emg-gpt-predict --help
          emg-gpt-download-tokenizer --help
          python -m pytest "$GITHUB_WORKSPACE/tests" -m "not weights"
      - name: Compare real checkpoints with the original implementation
        if: matrix.python-version == '3.12' && github.event_name != 'pull_request'
        run: |
          cd "$RUNNER_TEMP"
          hf download ettoremagni/EMG-GPT --revision 812d159b4e7a4fb1c95da865f4f1e2635fa6522f --include "regression/*" --include "tracking/*" --include "LICENSE" --local-dir weights
          emg-gpt-download-tokenizer --output weights/NeuroRVQ_EMG_tokenizer_v1.pt
          EMG_GPT_WEIGHTS="$RUNNER_TEMP/weights" python -m pytest "$GITHUB_WORKSPACE/tests" -m weights
