name: inference checks

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            constraints: cpu-tested
          - python-version: "3.12"
            constraints: cpu-tested
          - python-version: "3.11"
            constraints: minimum
    env:
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU runtime and test tools
        run: |
          python -m pip install torch -c constraints/${{ matrix.constraints }}.txt --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[dev,data,download]' -c constraints/${{ matrix.constraints }}.txt
      - run: ruff check src scripts tests
      - run: python scripts/check_release.py --profile review
      - run: python -m pytest
      - name: Publication metadata gate
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_release.py --profile publication
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install each distribution and test outside the checkout
        shell: bash
        run: |
          for package in "$GITHUB_WORKSPACE"/dist/*.whl "$GITHUB_WORKSPACE"/dist/*.tar.gz; do
            python -m pip install --force-reinstall --no-deps "$package"
            (
              cd "$RUNNER_TEMP"
              emg-gpt-predict --help
              emg-gpt-download-tokenizer --help
              python -c "from emg_gpt import PosePredictor, plan_windows; from emg_gpt.artifacts import resource_json; assert resource_json('tokenizer.json')['n_code'] == 8192; assert plan_windows(14000, 'regression').timestamps_s[0,0] == 1.2"
              python -m pytest "$GITHUB_WORKSPACE/tests"
            )
          done
